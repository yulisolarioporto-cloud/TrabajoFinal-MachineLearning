<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Objetos</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
<link rel="stylesheet" href="./style/Ejer004.css">

</head>
<body>

<h1>Detector de Objetos</h1>

<div id="canvas-container"></div>

<div class="campos">
    <div class="campo">
        <label>Objeto</label>
        <input type="text" id="descripcion" readonly>
    </div>

    <div class="campo">
        <label>Confianza</label>
        <input type="text" id="confianza" readonly>
    </div>
</div>

<div class="barra-wrap">
    <div id="barra"></div>
</div>

<div class="estado">
    <div id="dot"></div>
    <span id="estado-msg">Iniciando modelo...</span>
</div>

<script>

let classifier;
let video;
let ultimaEtiqueta = "";

const dot = document.getElementById("dot");
const estadoMsg = document.getElementById("estado-msg");
const barra = document.getElementById("barra");

function setEstado(msg, clase){
    estadoMsg.textContent = msg;
    dot.className = clase || "";
}

function preload() {

    console.log("Cargando modelo...");

    classifier = ml5.imageClassifier(
        "./models/model.json",
        () => {
            console.log("MODELO CARGADO");
        }
    );
}

function setup(){

    let cnv = createCanvas(320,260);

    cnv.parent("canvas-container");

    video = createCapture(VIDEO);

    video.size(320,260);

    video.hide();

    setEstado("Cámara activa","listo");

    classifyVideo();
}

function draw(){

    image(video,0,0,320,260);
}

function classifyVideo(){

    classifier.classify(
        video,
        gotResult
    );
}

function gotResult(error, results) {

    console.log("ERROR:", error);
    console.log("RESULTADOS:", results);

    if (error) {
        console.error(error);
        return;
    }

    if (!results || results.length === 0) {
        classifyVideo();
        return;
    }

    let res = results[0];

    let objeto = traducir(res.label);

    if (objeto === "") {
        classifyVideo();
        return;
    }

    let pct = (res.confidence * 100).toFixed(1);

    document.getElementById("descripcion").value = objeto;

    document.getElementById("confianza").value = pct + "%";

    barra.style.width = pct + "%";

    if (pct >= 70 && res.label !== ultimaEtiqueta) {

        hablar(objeto);

        ultimaEtiqueta = res.label;
    }

    classifyVideo();
}
function traducir(nombre){

    let n =
        nombre.toLowerCase();

    if(n.includes("botella"))
        return "Botella";

    if(n.includes("billetera"))
        return "Billetera";

    if(n.includes("controles"))
        return "Controles";

    if(n.includes("plumon"))
        return "Plumón";

    return "";
}

function hablar(texto){

    if(!window.speechSynthesis)
        return;

    speechSynthesis.cancel();

    let msg =
        new SpeechSynthesisUtterance(
            texto
        );

    msg.lang = "es-ES";

    msg.onstart = ()=>{
        setEstado(
            "Anunciando...",
            "hablando"
        );
    };

    msg.onend = ()=>{
        setEstado(
            "Detectando...",
            "listo"
        );
    };

    speechSynthesis.speak(msg);
}

</script>

</body>
</html>
